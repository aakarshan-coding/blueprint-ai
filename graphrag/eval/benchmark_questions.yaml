  question: "Which urllib3 exception does assert_header_parsing raise when a header fails validation, what does it inherit from, and what does that inherit from?"
  expects: "HeaderParsingError -> HTTPError -> Exception"
  must_contain: ["HeaderParsingError", "HTTPError", "Exception"]
  source: "urllib3/util/response.py + exceptions.py"

- id: 3h-40
  category: three_hop
  question: "Which exception does urllib3's HTTPResponse raise for an invalid chunk length, which urllib3 base does it inherit from, and which standard library exception is its other base?"
  expects: "InvalidChunkLength; HTTPError; http.client.IncompleteRead"
  must_contain: ["InvalidChunkLength", "HTTPError", "IncompleteRead"]
  source: "urllib3/response.py _update_chunk_length + exceptions.py"

- id: 3h-41
  category: three_hop
  question: "Which requests exception surfaces when urllib3 reports a proxy failure, what does it inherit from, and what does that inherit from?"
  expects: "ProxyError -> ConnectionError -> RequestException"
  must_contain: ["ProxyError", "ConnectionError", "RequestException"]
  source: "requests/adapters.py + exceptions.py"

- id: 3h-42
  category: three_hop
  question: "Which exception does Timeout.get_connect_duration raise if the connect timer was never started, what does it inherit from, and which urllib3 module defines the Timeout class?"
  expects: "TimeoutStateError -> HTTPError; urllib3.util.timeout"
  must_contain: ["TimeoutStateError", "HTTPError", "util.timeout"]
  source: "urllib3/util/timeout.py + exceptions.py"

- id: 3h-43
  category: three_hop
  question: "Which urllib3 exception does HTTPConnection._new_conn raise for a generic socket error, what does it inherit from, and what does that base inherit from?"
  expects: "NewConnectionError -> ConnectTimeoutError (and HTTPError) -> TimeoutError"
  must_contain: ["NewConnectionError", "ConnectTimeoutError", "TimeoutError"]
  source: "urllib3/connection.py + exceptions.py"

- id: 3h-44
  category: three_hop
  question: "Which requests class does HTTPDigestAuth inherit from, which method must that base's subclasses implement, and what does the base raise if it is not overridden?"
  expects: "AuthBase; __call__; NotImplementedError"
  must_contain: ["AuthBase", "__call__", "NotImplementedError"]
  source: "requests/auth.py"

- id: 3h-45
  category: three_hop
  question: "Which exception does HTTPConnectionPool._put_conn raise when the pool is full, what does it inherit from, and what does that inherit from?"
  expects: "FullPoolError -> PoolError -> HTTPError"
  must_contain: ["FullPoolError", "PoolError", "HTTPError"]
  source: "urllib3/connectionpool.py + exceptions.py"

