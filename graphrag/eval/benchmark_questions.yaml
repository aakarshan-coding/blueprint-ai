# Benchmark question set (design §10). Stratified by hop count so accuracy can
# be reported per difficulty — the widening gap as hops increase is the result
# the whole project exists to show.
#
# HONESTY NOTE, per §10's own warning: these were written from the source
# material (requests/urllib3 docs and source code), NOT generated from the
# graph. Generating from the graph guarantees every question is answerable by
# traversal, which rigs the comparison. Several questions here are deliberately
# ones the graph cannot answer well, and 10 are out of scope entirely.
#
# `expects` is what a correct answer must contain. `source` records where the
# answer was verified, so any claim here can be checked against real text.

# ---------------------------------------------------------------- single hop
# One fact, stated in one place. The vector baseline should do well here —
# parity at this level is expected, not a failure.

- id: sh-01
  category: single_hop
  question: "Does requests verify SSL certificates by default?"
  expects: "Yes — SSL verification is on by default"
  must_contain_any: ["verify", "verifies", "verified", "verification"]
  source: "docs/user/advanced.rst, SSL Cert Verification"

- id: sh-02
  category: single_hop
  question: "What does the timeout parameter do in requests?"
  expects: "Stops waiting for a response after a given number of seconds"
  source: "docs/user/quickstart.rst, Timeouts"

- id: sh-03
  category: single_hop
  question: "How do I send cookies with a request in requests?"
  expects: "Pass a dict to the cookies parameter"
  source: "docs/user/quickstart.rst, Cookies"

- id: sh-04
  category: single_hop
  question: "Does requests follow redirects automatically?"
  expects: "Yes, for all verbs except HEAD by default"
  must_contain_any: ["redirect", "redirects", "redirection", "redirected"]
  source: "docs/user/quickstart.rst, Redirection and History"

- id: sh-05
  category: single_hop
  question: "How does keep-alive work in requests?"
  expects: "Automatic within a session, provided by urllib3 connection pooling"
  must_contain: ["urllib3"]
  source: "docs/user/advanced.rst, Keep-Alive"

- id: sh-06
  category: single_hop
  question: "What is a Session object used for?"
  expects: "Persisting parameters and cookies across requests"
  source: "docs/user/advanced.rst, Session Objects"

- id: sh-07
  category: single_hop
  question: "How do I stream a large response instead of loading it all at once?"
  expects: "Pass stream=True"
  must_contain_any: ["stream", "streaming", "streamed"]
  source: "docs/user/advanced.rst, Body Content Workflow / Streaming Requests"

- id: sh-08
  category: single_hop
  question: "How do I use a proxy with requests?"
  expects: "Pass a proxies dict"
  must_contain_any: ["proxies", "proxy"]
  source: "docs/user/advanced.rst, Proxies"

- id: sh-09
  category: single_hop
  question: "What does allow_redirects control?"
  expects: "Whether redirects are followed"
  must_contain_any: ["redirect", "redirects", "redirection", "redirected"]
  source: "requests.sessions.Session.request docstring"

- id: sh-10
  category: single_hop
  question: "How do I supply a client-side certificate?"
  expects: "Pass the cert parameter, as a path or a (cert, key) tuple"
  must_contain_any: ["cert", "certificate", "certificates"]
  source: "docs/user/advanced.rst, Client Side Certificates"

- id: sh-11
  category: single_hop
  question: "What is a transport adapter in requests?"
  expects: "The mechanism defining how requests are made for an HTTP service"
  source: "docs/user/advanced.rst, Transport Adapters"

- id: sh-12
  category: single_hop
  question: "How does urllib3 let me set timeouts?"
  expects: "Timeout objects / timeout parameter controlling connect and read"
  source: "urllib3 docs, User Guide > Using Timeouts"

- id: sh-13
  category: single_hop
  question: "What does requests use for basic authentication?"
  expects: "HTTPBasicAuth, or a (user, pass) tuple passed to auth"
  must_contain_any: ["HTTPBasicAuth", "auth", "authentication"]
  source: "docs/user/authentication.rst, Basic Authentication"

- id: sh-14
  category: single_hop
  question: "What are event hooks in requests?"
  expects: "A hooks mechanism for running callbacks on parts of the request process"
  source: "docs/user/advanced.rst, Event Hooks"

- id: sh-15
  category: single_hop
  question: "How does urllib3 retry failed requests?"
  expects: "A Retry configuration controlling retry behaviour"
  source: "urllib3 docs, User Guide > Retrying Requests"

# ------------------------------------------------------------------ two hop
# Requires connecting two facts that live in different places — almost all of
