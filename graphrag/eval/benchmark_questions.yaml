# ------------------------------------------- additions, 2026-09-25 (D65)
# Three-hop and aggregation were the two categories where one question moved
# the score by 8-13 points (D60). Fifteen more of each, written from the source
# files named in `source` and checked against them line by line before being
# added -- not generated from the graph. The aggregation answers are things a
# person can verify by reading the class list in requests/exceptions.py.

# ---------------------------------------------------------- three hop (more)

- id: 3h-13
  category: three_hop
  question: "When Response.json() cannot decode the body, what exception does requests raise, what does it inherit from directly, and what is that parent's own base class?"
  expects: "JSONDecodeError -> InvalidJSONError -> RequestException"
  must_contain: ["JSONDecodeError", "InvalidJSONError", "RequestException"]
  source: "models.py Response.json (raise RequestsJSONDecodeError); exceptions.py class JSONDecodeError(InvalidJSONError, ...), class InvalidJSONError(RequestException)"

- id: 3h-14
  category: three_hop
  question: "What does Response.raise_for_status() raise on a 4xx or 5xx status, what does that exception inherit from, and what does that base class itself derive from?"
  expects: "HTTPError -> RequestException -> IOError"
  must_contain: ["HTTPError", "RequestException"]
  must_contain_any: ["IOError", "OSError"]
  source: "models.py raise_for_status; exceptions.py class HTTPError(RequestException), class RequestException(IOError)"

- id: 3h-15
  category: three_hop
  question: "When urllib3's Retry is exhausted, what does it raise, what does HTTPAdapter.send convert that into when the reason is a ResponseError, and what does the resulting exception inherit from?"
  expects: "MaxRetryError -> RetryError -> RequestException"
  must_contain: ["MaxRetryError", "RetryError", "RequestException"]
  source: "urllib3/util/retry.py increment (raise MaxRetryError); adapters.py send (isinstance(e.reason, ResponseError) -> raise RetryError); exceptions.py class RetryError(RequestException)"

- id: 3h-16
  category: three_hop
  question: "If a streamed response body is cut short, what does urllib3 raise, what does requests convert it to inside iter_content, and what is that exception's base class?"
  expects: "ProtocolError -> ChunkedEncodingError -> RequestException"
  must_contain: ["ChunkedEncodingError", "RequestException"]
  source: "models.py iter_content (except ProtocolError -> raise ChunkedEncodingError); exceptions.py class ChunkedEncodingError(RequestException)"

- id: 3h-17
  category: three_hop
  question: "When decoding a streamed body fails, which urllib3 error is caught in iter_content, which requests exception replaces it, and which two classes does that exception inherit from?"
  expects: "DecodeError -> ContentDecodingError, which inherits RequestException and urllib3's HTTPError (BaseHTTPError)"
  must_contain: ["ContentDecodingError", "RequestException"]
  source: "models.py iter_content (except DecodeError -> raise ContentDecodingError); exceptions.py class ContentDecodingError(RequestException, BaseHTTPError)"

- id: 3h-18
  category: three_hop
  question: "How does a Session decide which adapter handles a URL, which method makes that choice, and what does the chosen adapter's send() ultimately call in urllib3?"
  expects: "Adapters are mounted by URL prefix; Session.get_adapter picks the longest matching prefix; HTTPAdapter.send calls conn.urlopen on a urllib3 HTTPConnectionPool"
  must_contain: ["get_adapter", "urlopen"]
  source: "sessions.py mount, get_adapter (url.lower().startswith(prefix.lower())), send (adapter = self.get_adapter; adapter.send); adapters.py send (conn.urlopen)"

- id: 3h-19
  category: three_hop
  question: "What value does verify=False cause to be set on the urllib3 connection, which HTTPAdapter method sets it, and where does the verify value originally enter the call chain?"
  expects: "cert_reqs = CERT_NONE, set by HTTPAdapter.cert_verify; verify enters as a parameter of Session.request / requests.get"
  must_contain: ["CERT_NONE", "cert_verify"]
  source: "adapters.py cert_verify (conn.cert_reqs = 'CERT_NONE' / 'CERT_REQUIRED'); sessions.py request(verify=...)"

- id: 3h-20
  category: three_hop
  question: "Which exception does iter_content raise if the content was already consumed, what does it inherit from besides RequestException, and in which method is the check made?"
  expects: "StreamConsumedError, which also inherits TypeError; the check is in Response.iter_content"
  must_contain: ["StreamConsumedError", "TypeError"]
  source: "models.py iter_content (raise StreamConsumedError); exceptions.py class StreamConsumedError(RequestException, TypeError)"

