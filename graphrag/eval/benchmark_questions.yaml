  source: "sessions.py get_adapter (raise InvalidSchema); exceptions.py class InvalidSchema(RequestException, ValueError)"

- id: 3h-23
  category: three_hop
  question: "Starting in HTTPAdapter.__init__, which urllib3 class configures retries, which classmethod turns the max_retries integer into it, and what does that class raise when attempts run out?"
  expects: "Retry; Retry.from_int; MaxRetryError"
