services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"  # browser UI
      - "7687:7687"  # bolt
    environment:
      - NEO4J_AUTH=neo4j/graphragpassword
    volumes:
      - neo4j_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=graphrag
      - POSTGRES_PASSWORD=graphragpassword
      - POSTGRES_DB=graphrag
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  postgres_data:
